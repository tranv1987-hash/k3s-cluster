apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: wireguard-config
  namespace: networking # <--- Grouped with Pi-hole for easy Secret access
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path # <--- Explicitly use your working provisioner
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wireguard
  namespace: networking
spec:
  replicas: 1
  selector:
    matchLabels:
      app: wireguard
  template:
    metadata:
      labels:
        app: wireguard
    spec:
      containers:
      - name: wireguard
        image: ghcr.io/wg-easy/wg-easy
        securityContext:
          privileged: true
          capabilities:
            add:
              - NET_ADMIN
              - SYS_MODULE
        env:
          - name: WG_HOST
            value: "wireguard.vi3t-lab.com"
          - name: PASSWORD_HASH
            valueFrom:
              secretKeyRef:
                name: wireguard-secret
                key: PASSWORD_HASH
          - name: WG_PORT
            value: "51820"
          - name: WG_DEFAULT_ADDRESS
            value: "10.8.0.x"
          - name: WG_DEFAULT_DNS
            value: "192.168.30.195" # <--- POINT TO YOUR PI-HOLE IP
        ports:
        - containerPort: 51820
          name: wireguard
          protocol: UDP
        - containerPort: 51821
          name: web-ui
          protocol: TCP
        volumeMounts:
        - name: config
          mountPath: /etc/wireguard
      volumes:
      - name: config
        persistentVolumeClaim:
          claimName: wireguard-config
---
apiVersion: v1
kind: Service
metadata:
  name: wireguard-service
  namespace: networking
  annotations:
    metallb.universe.tf/allow-shared-ip: "wireguard-svc" # <--- Unique sharing key
spec:
  selector:
    app: wireguard
  type: LoadBalancer
  loadBalancerIP: "192.168.30.196" # <--- CHOOSE A UNIQUE IP IN YOUR POOL
  ports:
    - port: 51820
      targetPort: 51820
      protocol: UDP
      name: wireguard
    - port: 51821
      targetPort: 51821
      protocol: TCP
      name: web-ui
