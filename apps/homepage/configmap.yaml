# vi3t-lab homepage configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: homepage-config
  namespace: homepage
data:
  settings.yaml: |
    title: vi3t-lab
    theme: dark
    color: slate
  bookmarks.yaml: |
    []
  widgets.yaml: |
    - datetime:
        text_size: xl
        format:
          dateStyle: long
          timeStyle: short
          hour12: true
    - weather:
        latitude: 38.6979
        longitude: -90.3679
        units: imperial
        cache: 5
    - resources:
        label: pi-master-0
        cpu: true
        memory: true
        disk: /
        expanded: true
        url: http://192.168.30.10:61208
    - resources:
        label: pi-worker-1
        cpu: true
        memory: true
        expanded: true
        url: http://192.168.30.11:61208
    - resources:
        label: pi-worker-2
        cpu: true
        memory: true
        expanded: true
        url: http://192.168.30.12:61208
    - resources:
        label: pi-worker-3
        cpu: true
        memory: true
        expanded: true
        url: http://192.168.30.13:61208
  services.yaml: |
    - Monitoring:
        - Grafana:
            href: https://grafana.vi3t-lab.com
            description: Metrics & Dashboards
            icon: grafana.png
            siteMonitor: http://monitoring-grafana.monitoring.svc.cluster.local
        - Uptime Kuma:
            href: https://uptime.vi3t-lab.com
            description: Service Uptime Monitor
            icon: uptime-kuma.png
            siteMonitor: http://uptime-kuma.uptime-kuma.svc.cluster.local:3001
    - DNS:
        - Pi-hole:
            href: https://pihole.vi3t-lab.com
            description: Local DNS & Ad Blocking
            icon: pi-hole.png
            siteMonitor: http://pihole-web.pihole.svc.cluster.local
            widget:
              type: pihole
              url: http://pihole-web.pihole.svc.cluster.local
              key: "{{HOMEPAGE_VAR_PIHOLE_TOKEN}}"
    - VPN:
        - WireGuard:
            href: http://192.168.30.192:51821
            description: VPN Tunnel
            icon: wireguard.png
            siteMonitor: http://wg-easy.wireguard.svc.cluster.local:51821
    - Infrastructure:
        - ArgoCD:
            href: https://argocd.vi3t-lab.com
            description: GitOps Deployment
            icon: argo-cd.png
            siteMonitor: http://argocd-server.argocd.svc.cluster.local
    - Network:
        - Unifi:
            href: https://192.168.1.1
            description: Network Controller
            icon: unifi.png
        - TP-Link Switch:
            href: http://192.168.99.2
            description: TL-SG2210P Management
            icon: tp-link.png
    - Online:
        - Cloudflare:
            href: https://dash.cloudflare.com
            description: DNS & Domain Management
            icon: cloudflare.png
        - GitHub:
            href: https://github.com/tranv1987-hash
            description: k3s Cluster Repo
            icon: github.png
    - Games:
        - Minecraft:
            href: https://mc.vi3t-lab.com
            description: Vanilla Minecraft Java Server
            icon: minecraft.png
            widget:
              type: minecraft
              url: udp://minecraft.minecraft.svc.cluster.local:25565
  kubernetes.yaml: |
    mode: disabled
