apiVersion: apps/v1
kind: Deployment
metadata:
  name: openvpn-as
  namespace: openvpn
spec:
  replicas: 1
  selector:
    matchLabels:
      app: openvpn-as
  template:
    metadata:
      labels:
        app: openvpn-as
    spec:
      containers:
        - name: openvpn-as
          image: linuxserver/openvpn-as:2.13.1
          securityContext:
            capabilities:
              add:
                - NET_ADMIN
          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: TZ
              value: "America/Chicago"
          ports:
            - containerPort: 1194
              protocol: UDP
            - containerPort: 943
              protocol: TCP
            - containerPort: 443
              protocol: TCP
          volumeMounts:
            - name: openvpn-config
              mountPath: /config
      volumes:
        - name: openvpn-config
          hostPath:
            path: /var/lib/openvpn-as
            type: DirectoryOrCreate
