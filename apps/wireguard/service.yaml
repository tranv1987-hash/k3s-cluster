apiVersion: v1
kind: Service
metadata:
  name: wg-easy
  namespace: wireguard
  annotations:
    metallb.universe.tf/loadBalancerIPs: 192.168.30.192
spec:
  type: LoadBalancer
  selector:
    app: wg-easy
  ports:
    - name: wireguard
      port: 51820
      protocol: UDP
      targetPort: 51820
    - name: web-ui
      port: 51821
      protocol: TCP
      targetPort: 51821
