apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cloudflare-ddns
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/tranv1987-hash/k3s-cluster
    targetRevision: HEAD
    path: apps/cloudflare-ddns
  destination:
    server: https://kubernetes.default.svc
    namespace: cloudflare-ddns
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
