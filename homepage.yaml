apiVersion: v1
kind: Namespace
metadata:
  name: homepage
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: homepage-config
  namespace: homepage
data:
  settings.yaml: |
    title: Home Lab
    background: "#0f172a"
    cardBlur: sm
    theme: dark
    color: slate
    layout:
      Management:
        style: row
        columns: 2
      Network:
        style: row
        columns: 2
      Gaming:
        style: row
        columns: 2
  services.yaml: |
    - Management:
        - Uptime Kuma:
            icon: uptime-kuma.png
            href: https://uptime.192.168.30.190.nip.io  # <--- CHANGED to Traefik IP (.190)
            description: Network Monitor
        - ArgoCD:
            icon: argo-cd.png
            href: https://argocd.192.168.30.190.nip.io   # <--- CHANGED to Traefik IP (.190)
            description: GitOps Controller
    - Network:
        - Pi-hole:
            icon: pi-hole.png
            href: http://192.168.30.195/admin/            # <--- CHANGED to new Pi-hole IP (.195)
            description: Ad Blocker
            widget:
                type: pihole
                url: http://192.168.30.195
                key: "YOUR_API_KEY_HERE"  # (Optional: Add later for live stats)
    - Infrastructure:
        - WireGuard VPN:
            icon: wireguard.png
            href: http://192.168.30.196:51821             # <--- CHANGED to new WireGuard IP (.196)
            description: "Admin Panel"
    - Gaming:
        - NES Emulator:
            icon: mdi-controller-classic
            href: https://nes.192.168.30.190.nip.io       # <--- CHANGED to Traefik IP (.190)
            description: Retro Gaming
        - Minecraft Server:
            icon: minecraft.png
            href: "#"
            description: "Survival Mode"
            widget:
                type: gamedig
                game: minecraft
                host: 192.168.30.200
                port: 25565
  widgets.yaml: |
    - greeting:
        text_size: xl
        text: "Welcome Home, Tran."
    - kubernetes:
        cluster:
          show: true
          cpu: true
          memory: true
          showLabel: true
          label: "cluster"
        nodes:
          show: true
          cpu: true
          memory: true
          showLabel: true
  bookmarks.yaml: |
    - Developer:
        - GitHub:
            - abbr: GH
              href: https://github.com/
  kubernetes.yaml: |
    mode: cluster
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: homepage
  namespace: homepage
spec:
  replicas: 1
  selector:
    matchLabels:
      app: homepage
  template:
    metadata:
      labels:
        app: homepage
    spec:
      serviceAccountName: homepage
      initContainers:
      - name: setup-icons
        image: busybox
        command: ["sh", "-c", "wget -q -O /app/config/icons/uptime-kuma.png https://cdn.jsdelivr.net/gh/walkxcode/dashboard-icons/png/uptime-kuma.png && wget -q -O /app/config/icons/argo-cd.png https://cdn.jsdelivr.net/gh/walkxcode/dashboard-icons/png/argo-cd.png && wget -q -O /app/config/icons/pi-hole.png https://cdn.jsdelivr.net/gh/walkxcode/dashboard-icons/png/pi-hole.png"]
        volumeMounts:
        - name: config
          mountPath: /app/config
      containers:
      - name: homepage
        image: ghcr.io/gethomepage/homepage:latest
        ports:
        - containerPort: 3000
        volumeMounts:
        - name: config-source
          mountPath: /app/config/settings.yaml
          subPath: settings.yaml
        - name: config-source
          mountPath: /app/config/services.yaml
          subPath: services.yaml
        - name: config-source
          mountPath: /app/config/widgets.yaml
          subPath: widgets.yaml
        - name: config-source
          mountPath: /app/config/bookmarks.yaml
          subPath: bookmarks.yaml
        - name: config-source
          mountPath: /app/config/kubernetes.yaml
          subPath: kubernetes.yaml
      volumes:
      - name: config-source
        configMap:
          name: homepage-config
      - name: config
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: homepage-service
  namespace: homepage
spec:
  selector:
    app: homepage
  ports:
  - port: 80
    targetPort: 3000
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: homepage-ingress
  namespace: homepage
  annotations:
    cert-manager.io/cluster-issuer: selfsigned-issuer
spec:
  ingressClassName: traefik  # <--- CHANGED to ensure Traefik picks it up
  tls:
  - hosts:
    - home.192.168.30.190.nip.io  # <--- CHANGED to Traefik IP
    secretName: homepage-tls-secret
  rules:
  - host: home.192.168.30.190.nip.io # <--- CHANGED to Traefik IP
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: homepage-service
            port:
              number: 80
