apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: uptime-kuma-ingress
  namespace: uptime-kuma
  annotations:
    cert-manager.io/cluster-issuer: selfsigned-issuer
spec:
  ingressClassName: traefik  # <--- CHANGED: Matches your K3s default controller
  tls:
  - hosts:
    - uptime.192.168.30.190.nip.io  # <--- CHANGED: Points to Traefik LoadBalancer
    secretName: uptime-kuma-tls-secret
  rules:
  - host: uptime.192.168.30.190.nip.io  # <--- CHANGED: Points to Traefik LoadBalancer
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: uptime-kuma-service
            port:
              number: 80
