apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: my-ingress-rules
  namespace: networking  # <--- Ensure this matches where 'my-website-service' lives!
spec:
  ingressClassName: traefik  # <--- CHANGED: K3s uses Traefik, not Nginx
  rules:
  - host: website.192.168.30.190.nip.io  # <--- CHANGED: Points to Traefik LoadBalancer
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: my-website-service
            port:
              number: 8080 # (Double check this matches your Service's port!)
