apiVersion: metallb.io/v1beta1
kind: IPAddressPool
metadata:
  name: pi-cluster-pool
  namespace: metallb-system
spec:
  addresses:
  - 192.168.30.190-192.168.30.230

---
apiVersion: metallb.io/v1beta1
kind: L2Advertisement
metadata:
  name: l2-advert
  namespace: metallb-system
spec:
  ipAddressPools:
  - pi-cluster-pool
